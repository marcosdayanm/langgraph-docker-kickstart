services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langgraph?sslmode=disable
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      LANGGRAPH_STRICT_MSGPACK: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${GCP_ADC_PATH:?Set GCP_ADC_PATH in .env to your absolute ADC file path}:/gcp/adc.json:ro

volumes:
  postgres_data:
